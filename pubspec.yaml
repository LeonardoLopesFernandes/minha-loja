name: minhaloja
description: "Port fiel do app Android MLoja para Flutter."
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  webview_flutter: ^4.4.2
  mobile_scanner: ^4.0.0
  provider: ^6.1.1
  pdf_render: ^1.2.0
  image: ^4.1.0
  pdf: ^3.11.1
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/overlays/
