name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Patch pdf_render (remove dead Registrar import incompatible with current Flutter)
        run: |
          F=$(find "${PUB_CACHE:-$HOME/.pub-cache}" /home/runner/.pub-cache "$HOME/.pub-cache" -path "*pdf_render*/android/src/main/kotlin/jp/espresso3389/pdf_render/PdfRenderPlugin.kt" 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            echo "Patching pdf_render source: $F"
            sed -i '/import io.flutter.plugin.common.PluginRegistry.Registrar/d' "$F"
          else
            echo "pdf_render source not found; skipping patch"
          fi

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install matching NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -1)
          for v in 27.0.12077973 27.1.12297006 28.2.13676358; do
            echo "y" | "$SDKMANAGER" "ndk;$v"
          done

      - name: Build APK (arm64-v8a only)
        run: flutter build apk --release --target-platform=android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
