name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install matching NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -1)
          for v in 27.0.12077973 27.1.12297006 28.2.13676358; do
            echo "y" | "$SDKMANAGER" "ndk;$v"
          done

      - name: Build APK (arm64-v8a only)
        run: flutter build apk --release --target-platform=android-arm64 --dart-define=CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
